name: Reprodução dos modelos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    name: Gerar, treinar e validar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements.txt
      - name: Recriar base sintética
        run: python gerar_base_ficticia.py
      - name: Treinar modelos e simular cenários
        run: python work/train_model.py
      - name: Verificar dados regenerados e regras financeiras
        run: node work/test_engine.js
