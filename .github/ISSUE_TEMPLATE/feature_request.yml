name: Sugerir uma melhoria
description: Proponha uma evolução com um caso de uso concreto.
title: '[Melhoria] '
body:
  - type: textarea
    id: problem
    attributes:
      label: Que problema você quer resolver?
      description: Descreva para quem a melhoria seria útil e em qual situação.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Explique o comportamento desejado e as hipóteses ou dados necessários.
    validations:
      required: true
